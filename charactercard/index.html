<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Snortleblat, a swamp beast diplomat.">
    <meta property="og:title" content="Snortleblat | Character Card">
    <meta property="og:description" content="Snortleblat, a swamp beast diplomat.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://shadowknight-13.github.io/WDD131/charactercard/">
    <meta property="og:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">
    <meta property="og:image:alt" content="Snortleblat, a swamp beast diplomat">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snortleblat | Character Card">
    <meta name="twitter:description" content="Meet Snortleblat, a swamp beast diplomat, in this interactive character card.">
    <meta name="twitter:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">
    <title>Snortleblat | Character Card</title>
    <link rel="preconnect" href="https://andejuli.github.io">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <article class="card" aria-labelledby="character-name">
            <img class="character-image" src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp" alt="Snortleblat, a swamp beast diplomat" width="400" height="400" fetchpriority="high">
            <div class="card-content">
                <p class="eyebrow">Character card</p>
                <h1 id="character-name">Snortleblat</h1>
                <dl class="stats">
                    <div><dt>Class</dt><dd id="character-class">Swamp Beast Diplomat</dd></div>
                    <div><dt>Level</dt><dd id="character-level">5</dd></div>
                    <div><dt>Health</dt><dd id="character-health">100</dd></div>
                </dl>
                <div class="actions">
                    <button id="attacked" type="button">Attacked</button>
                    <button id="level-up" type="button">Level Up</button>
                </div>
                <p id="status" role="status" aria-atomic="true"></p>
            </div>
        </article>
    </main>
</body>
</html>
